name: Build llama.cpp CUDA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone llama.cpp
        run: |
          git clone https://github.com/ggml-org/llama.cpp.git

      - name: Install build tools and CUDA
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential nvidia-cuda-toolkit

      - name: Configure llama.cpp with CUDA
        run: |
          cmake -S llama.cpp -B llama.cpp/build \
            -DGGML_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES=75

      - name: Build llama.cpp
        run: |
          cmake --build llama.cpp/build --config Release -j2

      - name: Check llama-cli
        run: |
          ./llama.cpp/build/bin/llama-cli --version

      - name: Package complete build
        run: |
          tar -czf llama-cpp-cuda.tar.gz -C llama.cpp/build .

      - name: Publish build as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            llama-cpp-cuda.tar.gz \
            --repo HassanFawadHaider/qwen27b-local-ai \
            --title "llama.cpp CUDA Build ${{ github.run_number }}" \
            --notes "CUDA-enabled llama.cpp build for Tesla T4 deployment."
